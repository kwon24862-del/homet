/* Layout: one-column phone log · sticky day header · fixed bottom tab bar · floating rest timer */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#1F2D36; --sub:#66737B; --line:#D6DDE2;
  --accent:#3E6FA8; --accent-soft:#E3ECF7; --deload:#FCE7CC; --deload-ink:#8A5A12;
  --good:#2E8B57; --good-soft:#D3EEDC; --mid:#C98A12; --mid-soft:#FCE4B8; --bad:#C0504D; --bad-soft:#F8D5D0;
  --c-body:#E6F0EA; --c-bar:#E7ECF5; --c-db:#F6ECE2; --c-core:#F1E8F2; --c-flex:#DDF1EE;
  --font:"Bazzi",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --head:"DNF","Bazzi",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181D; --surface:#1B232A; --sunk:#222C34; --ink:#E8EDF1; --sub:#9AA7B0; --line:#2F3B45;
  --accent:#7FA9DF; --accent-soft:#22334A; --deload:#3A2E1C; --deload-ink:#F2C27A;
  --good:#5CC48A; --good-soft:#1E3A2A; --mid:#E4AE48; --mid-soft:#3B3020; --bad:#E07B77; --bad-soft:#3E2523;
  --c-body:#1F3127; --c-bar:#202C3D; --c-db:#3A2C20; --c-core:#33253A; --c-flex:#1C3633; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181D; --surface:#1B232A; --sunk:#222C34; --ink:#E8EDF1; --sub:#9AA7B0; --line:#2F3B45;
  --accent:#7FA9DF; --accent-soft:#22334A; --deload:#3A2E1C; --deload-ink:#F2C27A;
  --good:#5CC48A; --good-soft:#1E3A2A; --mid:#E4AE48; --mid-soft:#3B3020; --bad:#E07B77; --bad-soft:#3E2523;
  --c-body:#1F3127; --c-bar:#202C3D; --c-db:#3A2C20; --c-core:#33253A; --c-flex:#1C3633; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
.btn{display:block;width:100%;min-height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:15px;padding:10px 12px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--head)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.ses-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ses-card{margin-top:14px;border-radius:18px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);text-align:center;display:grid;gap:8px}
.ses-card.k-warm{background:var(--c-db)} .ses-card.k-reps,.ses-card.k-hold{background:var(--accent-soft)}
.ses-card.k-rest{background:var(--good-soft)} .ses-card.k-cardio{background:var(--c-flex)} .ses-card.k-flex{background:var(--c-core)} .ses-card.k-done{background:var(--good-soft)}
.ses-kind{font-size:13px;color:var(--sub);letter-spacing:.04em}
.ses-title{font-size:22px;line-height:1.25}
.ses-sub{font-size:14px;color:var(--sub)}
.ses-clock{font-family:var(--head);font-size:76px;line-height:1.05;margin:6px 0}
.ses-ctrl,.ses-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ses-guide{background:none;border:0;color:var(--accent);font-size:13px;cursor:pointer}
.ses-next{margin-top:10px;font-size:14px;text-align:center}
.reps{display:grid;gap:10px;text-align:left;margin-top:6px}
.rep-row{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.rep-b{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:28px}
.rep-in{height:64px;text-align:center;font-size:34px !important;font-family:var(--head)}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--sunk)}
.flow span+span::before{content:"→ ";color:var(--sub)}
.small-seg button{height:40px;font-size:14px;font-family:var(--font)}
.small-seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-content:end;grid-column:span 2}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13px}
.free-clock{text-align:center;border-radius:14px;padding:10px;background:var(--sunk)}
.free-clock.work{background:var(--accent-soft)} .free-clock.rest{background:var(--good-soft)}
.free-clock .num{font-family:var(--head);font-size:60px;line-height:1.1}
.free-ph{font-size:13px;color:var(--sub);min-height:18px}
.btn[disabled]{opacity:.45}
ol.howto{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.head{font-family:var(--head);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.small{font-size:12.5px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:19px}
.save{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--mid)} .dot.off{background:var(--bad)}
.daynav{display:flex;align-items:center;gap:8px;margin-top:10px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.daynav .when{flex:1;min-width:0;text-align:center}
.when .d{font-family:var(--head);font-size:17px}
.when .w{font-size:12.5px;color:var(--sub)}

.sec>h2 .aside{margin-left:auto;font-family:var(--font);font-size:12px;color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.ex{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc,var(--line));border-radius:var(--r);padding:11px 12px;margin-bottom:8px}
.ex-top{display:flex;align-items:flex-start;gap:8px}

.ex-tgt{font-size:12.5px;color:var(--sub);margin-top:2px}

.prev{font-size:12px;color:var(--accent);margin-top:6px}

.sets label{font-size:11px;color:var(--sub);text-align:center;display:flex;flex-direction:column;gap:3px}
.sets input{text-align:center;padding:9px 2px;font-size:16px;font-variant-numeric:tabular-nums}

.sets input.done{background:var(--good-soft);border-color:var(--good)}

/* toggles */
.tgl{display:flex;flex-wrap:wrap;gap:7px}
.tgl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tgl button::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--sub)}
.tgl button[aria-pressed=true]{background:var(--good-soft);border-color:var(--good)}

.tgl-h{font-size:12.5px;color:var(--sub);margin:10px 2px 6px}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:9;width:min(528px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--head);font-size:26px;font-variant-numeric:tabular-nums;min-width:74px}
.timer .lab{flex:1;min-width:0;font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:9px;height:36px;padding:0 10px;font-size:13px}
.timer.ring{background:var(--good);color:#fff}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 0 0 14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;width:100%;max-width:560px}

.wk button.s-△{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.wk button.s-X{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.wk button.today{outline:2px solid var(--accent);outline-offset:1px}
.wk .sc{font-size:12px;text-align:right;color:var(--sub)}
.chart{width:100%;height:auto;display:block}

.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:86px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* measure */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.mcard h3{font-size:15px;display:flex;align-items:baseline;gap:8px}
.mcard h3 span{font-family:var(--font);font-size:12px;color:var(--sub)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.target{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.target .kpi .v{font-size:19px}

/* guide */
.search{margin-bottom:10px}
details.g{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc,var(--line));border-radius:var(--r);margin-bottom:8px}

details.g summary span{display:block;font-size:12px;color:var(--sub)}
.gbody{padding:0 12px 12px;display:grid;gap:8px;font-size:14px}
.gbody dt{font-size:12px;color:var(--sub)}
.gbody dd{margin:2px 0 0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:21;width:min(560px,100%);max-height:82%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}

.empty{padding:16px;text-align:center;color:var(--sub);font-size:13.5px}
.review{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

,"내려갈 때 들이쉬고 올라올 때 내쉰다. 2초 내려가기 · 1초 올라오기.","허리가 처지거나 엉덩이가 들림 / 팔꿈치가 90도로 옆으로 벌어짐(어깨 부담) / 범위가 짧음","무릎 대고, 또는 벤치에 손 짚고","발을 벤치에(디클라인), 3초 하강, 맨 아래 1초 정지","1~4단계"],["디클라인 푸시업","맨몸","윗가슴, 전면 어깨, 삼두","① 발을 벤치 위에 올리고 푸시업바를 잡는다. ② 몸을 일직선으로 유지하며 가슴을 깊게 내린다. ③ 밀어 올린다.","푸시업과 동일.","허리가 아래로 꺾임 / 머리만 내려가고 가슴은 안 내려감","발을 낮은 곳에","맨 아래 정지, 한 발 들기","2~4단계"],["파이크 푸시업","맨몸","어깨(삼각근 전면), 삼두","① 푸시업 자세에서 엉덩이를 높이 들어 몸을 ∧ 모양으로 만든다. ② 머리가 손 사이 앞쪽 바닥을 향하도록 팔꿈치를 굽혀 내려간다. ③ 바닥을 밀어 올라온다.","내려갈 때 들이쉬고 올라올 때 내쉬기.","엉덩이가 내려가 일반 푸시업이 됨 / 팔꿈치가 옆으로 크게 벌어짐","손을 벤치에 짚기","발을 벤치에 올리기","1단계"],["벤치 딥스","맨몸","삼두, 전면 어깨","① 벤치 끝에 손을 엉덩이 옆에 짚고 엉덩이를 벤치 앞으로 뺀다. ② 팔꿈치를 뒤로 굽혀 상완이 바닥과 평행해질 때까지 내려간다. ③ 손바닥으로 밀어 올라온다.","내려갈 때 들이쉬기.","너무 깊게 내려가 어깨 앞쪽이 아픔 / 팔꿈치가 옆으로 벌어짐 / 벤치가 미끄러짐(벽에 붙여 고정)","무릎 굽혀 발을 가까이","다리 펴기, 발을 의자 위에","1~4단계"],["다이아몬드 푸시업","맨몸","삼두, 안쪽 가슴","① 양손 엄지와 검지를 붙여 다이아몬드 모양을 만들어 가슴 아래에 둔다. ② 팔꿈치를 몸통에 붙인 채 내려간다. ③ 밀어 올린다.","푸시업과 동일.","손목 통증이 있으면 손 간격을 조금 넓히기","무릎 대고","3초 하강","2·4단계"],["월싯","맨몸","대퇴사두(허벅지 앞), 지구력","① 벽에 등을 대고 무릎과 고관절이 90도가 되게 앉는다. ② 무릎이 발끝 방향을 향하게 유지한다. ③ 정해진 시간 동안 버틴다.","멈추지 말고 일정하게 호흡.","엉덩이가 무릎보다 높음(너무 쉬움) / 손으로 허벅지를 누름","각도를 덜 앉기","덤벨을 허벅지 위에 올리기, 한 다리","1단계"],["싱글레그 글루트 브릿지","맨몸","대둔근, 햄스트링","① 누워서 한쪽 무릎을 세우고 반대 다리는 펴서 든다. ② 발뒤꿈치로 바닥을 밀며 엉덩이를 들어 어깨–골반–무릎이 일직선이 되게 한다. ③ 맨 위에서 1초 쥐어짜고 내린다.","올릴 때 내쉬기.","허리를 꺾어서 올리기 / 골반이 한쪽으로 기울어짐","양발 글루트 브릿지","덤벨을 골반 위에, 어깨를 벤치에","1단계"],["덤벨 벤치프레스","덤벨","대흉근, 삼두, 전면 어깨","① 벤치에 누워 발을 바닥에 단단히 딛고 날개뼈를 모아 가슴을 살짝 연다. ② 덤벨을 가슴 옆에서 팔꿈치 약 45도로 시작한다. ③ 가슴 위로 밀어 올려 맨 위에서 덤벨이 가까워지게 한다. ④ 3초 동안 천천히 내린다.","밀 때 내쉬고 내릴 때 들이쉬기.","엉덩이가 들림 / 팔꿈치를 90도로 벌림 / 내릴 때 툭 떨어뜨림","가벼운 무게, 범위 짧게","3초 하강 + 맨 아래 1초 정지, 1.5회 반복","1·4단계"],["인클라인 덤벨 프레스","덤벨","윗가슴, 전면 어깨","① 벤치를 30~45도로 세운다. ② 덤벨을 쇄골 옆에서 시작해 위로 민다. ③ 천천히 내린다.","밀 때 내쉬기.","각도를 너무 세워 어깨 운동이 됨 / 허리를 과하게 아치","30도로 낮추기","3초 하강, 무거운 무게 6~10회","2~4단계"],["인클라인 덤벨 플라이","덤벨","대흉근 (스트레칭 자극)","① 인클라인 벤치에서 덤벨을 가슴 위에 모으고 팔꿈치를 살짝 굽힌다. ② 팔꿈치 각도를 유지한 채 양옆으로 크게 벌려 가슴이 늘어나게 한다. ③ 큰 나무를 껴안듯 모은다.","벌릴 때 들이쉬고 모을 때 내쉬기.","팔꿈치를 굽혔다 폈다 하며 프레스로 바뀜 / 너무 깊게 내려 어깨 통증","가벼운 무게, 범위 줄이기","맨 아래 1초 정지","1단계"],["원암 덤벨 로우","덤벨","광배근, 능형근, 후면 어깨","① 같은 쪽 손과 무릎을 벤치에 올려 등을 평평하게 한다. ② 반대 손으로 덤벨을 잡고 팔을 늘어뜨린다. ③ 팔꿈치를 골반 쪽으로 끌어당겨 덤벨을 옆구리로 올린다. ④ 천천히 끝까지 내려 등이 늘어나게 한다.","당길 때 내쉬기.","몸통을 비틀어 들어 올리기 / 손으로만 당기기(이두 운동이 됨) / 등이 둥글게 말림","가벼운 무게","맨 위 1초 정지, 3초 하강","1~4단계"],["체스트 서포티드 로우","덤벨","등 중앙, 후면 어깨","① 벤치를 30~45도로 세우고 가슴을 대고 엎드린다. ② 양손에 덤벨을 들고 팔을 늘어뜨린다. ③ 날개뼈를 모으며 팔꿈치를 뒤로 당긴다. ④ 천천히 내린다.","당길 때 내쉬기.","가슴이 벤치에서 떨어지며 반동 / 어깨를 으쓱","가벼운 무게","맨 위 2초 정지","2~4단계"],["덤벨 풀오버","덤벨","광배근, 대흉근, 갈비뼈 주변","① 벤치에 등을 가로로 대거나 세로로 누워 덤벨 하나를 양손으로 가슴 위에 든다. ② 팔꿈치를 살짝 굽힌 채 머리 뒤로 천천히 내려 등과 가슴이 늘어나게 한다. ③ 가슴 위로 다시 끌어온다.","내릴 때 들이쉬고 올릴 때 내쉬기.","허리가 과하게 꺾임 / 너무 깊게 내려 어깨 통증","범위 줄이기","맨 아래 1초 정지","2단계"],["시티드 덤벨 숄더프레스","덤벨","삼각근 전면·측면, 삼두","① 벤치를 거의 수직으로 세우고 등을 붙인다. ② 덤벨을 귀 옆, 팔꿈치가 손목 바로 아래에 오게 든다. ③ 머리 위로 밀어 올린다. ④ 귀 높이까지 천천히 내린다.","밀 때 내쉬기.","허리를 크게 젖혀 가슴으로 밀기 / 덤벨을 너무 낮게 내림","가벼운 무게","3초 하강, 6~10회 무겁게","1·4단계"],["아놀드 프레스","덤벨","삼각근 전체","① 앉아서 손바닥이 나를 향하게 덤벨을 턱 앞에 든다. ② 밀어 올리면서 손목을 돌려 맨 위에서 손바닥이 앞을 향하게 한다. ③ 반대로 돌리며 내린다.","밀 때 내쉬기.","회전을 빠르게 해 반동 / 허리 젖힘","가벼운 무게","3초 하강","2·3단계"],["사이드 레터럴 레이즈","덤벨","삼각근 측면 (어깨 너비)","① 3~6kg 덤벨을 몸 옆에 들고 팔꿈치를 살짝 굽힌다. ② 팔꿈치가 앞장서듯 옆으로 들어 어깨 높이까지 올린다. ③ 2초 동안 천천히 내린다.","올릴 때 내쉬기.","무거운 무게로 반동, 승모근(목 옆)으로 들기 / 손목이 팔꿈치보다 높아짐","한 팔씩, 더 가볍게","드롭세트, 맨 위 1초 정지","1~4단계"],["리어델트 플라이","덤벨","삼각근 후면, 능형근 (굽은 어깨 교정)","① 인클라인 벤치에 엎드리거나 상체를 숙인다. ② 3~6kg 덤벨을 들고 팔꿈치를 살짝 굽힌 채 양옆으로 벌린다. ③ 날개뼈를 너무 모으지 말고 어깨 뒤쪽으로 든다. ④ 천천히 내린다.","올릴 때 내쉬기.","무거워서 등 운동(로우)이 됨 / 반동","더 가볍게","맨 위 1초 정지","1~4단계"],["덤벨 컬","덤벨","이두","① 서거나 앉아서 손바닥이 앞을 향하게 덤벨을 든다. ② 팔꿈치를 옆구리에 고정한 채 덤벨을 어깨 쪽으로 감아 올린다. ③ 2~3초 동안 끝까지 내린다.","올릴 때 내쉬기.","상체를 뒤로 젖혀 반동 / 팔꿈치가 앞으로 나옴 / 끝까지 안 내림","한 팔씩","3초 하강, 21s(아래 반·위 반·전체 각 7회)","1·4단계"],["인클라인 덤벨 컬","덤벨","이두 (늘어난 상태에서 자극)","① 벤치를 45도로 세우고 등을 기댄 채 팔을 아래로 늘어뜨린다. ② 팔꿈치 위치를 고정하고 감아 올린다. ③ 끝까지 천천히 내려 이두가 늘어나게 한다.","올릴 때 내쉬기.","어깨가 앞으로 나오며 팔꿈치가 따라옴","가벼운 무게","맨 아래 1초 정지","2·4단계"],["해머 컬","덤벨","상완근, 전완근 (팔 바깥쪽 두께)","① 손바닥이 서로 마주 보게(망치 잡듯) 덤벨을 든다. ② 팔꿈치를 고정한 채 감아 올린다. ③ 천천히 내린다.","올릴 때 내쉬기.","반동 / 손목이 꺾임","한 팔씩","몸 앞을 가로지르는 크로스 해머 컬","1·2·4단계"],["오버헤드 트라이셉스 익스텐션","덤벨","삼두 장두 (팔 뒤쪽 두께의 핵심)","① 앉아서 덤벨 하나를 양손으로 잡고 머리 위로 든다. ② 팔꿈치를 앞을 향하게 고정한 채 덤벨을 머리 뒤로 천천히 내린다. ③ 팔을 펴 올린다.","내릴 때 들이쉬고 펼 때 내쉬기.","팔꿈치가 옆으로 벌어짐 / 허리를 젖힘","가벼운 무게, 범위 줄이기","한 팔씩, 3초 하강","1~4단계"],["고블릿 스쿼트","덤벨","대퇴사두, 둔근, 코어","① 덤벨 하나를 세워 가슴 앞에 양손으로 감싸 든다. ② 발은 어깨너비, 발끝 약간 바깥. ③ 가슴을 세운 채 엉덩이를 뒤·아래로 앉아 허벅지가 바닥과 평행 이하로 내려간다. ④ 바닥을 밀어 일어난다. 템포 3-1-1: 3초 내려가기, 1초 정지, 1초 올라오기.","내려갈 때 들이쉬고 배에 힘, 올라올 때 내쉬기.","무릎이 안쪽으로 모임 / 뒤꿈치가 뜸 / 상체가 숙여지며 등이 굽음","범위를 의자 높이까지","양손 덤벨 스쿼트, 맨 아래 2초 정지","1단계"],["양손 덤벨 스쿼트","덤벨","대퇴사두, 둔근","① 양손에 덤벨을 몸 옆에 들거나 어깨 위에 올린다. ② 고블릿 스쿼트와 같은 방법으로 앉았다 일어난다.","고블릿 스쿼트와 동일.","덤벨 무게에 상체가 앞으로 쏠림","고블릿 스쿼트","3초 하강, 1.5회 반복","2~4단계"],["뒤꿈치 올린 고블릿 스쿼트","덤벨","대퇴사두 (허벅지 앞 집중)","① 뒤꿈치 아래에 원판이나 두꺼운 책(2~3cm)을 둔다. ② 상체를 세우고 무릎이 발끝 앞으로 나가도 되도록 깊게 앉는다. ③ 일어난다.","고블릿 스쿼트와 동일.","받침이 미끄러짐 / 무릎 통증이 있으면 범위 줄이기","받침 낮추기","맨 아래 정지","2~4단계"],["불가리안 스플릿 스쿼트","덤벨","대퇴사두, 둔근 (한 다리, 가벼운 덤벨로도 강함)","① 벤치 앞에 서서 한 발 등을 벤치 위에 올린다. ② 앞발은 벤치에서 한 걸음 반 앞에. ③ 상체를 살짝 숙이고 뒷무릎이 바닥 가까이 갈 때까지 수직으로 내려간다. ④ 앞발 뒤꿈치로 밀어 올라온다.","내려갈 때 들이쉬기.","앞발이 너무 가까워 무릎이 아픔 / 뒷다리로 밀어 올림 / 접이식 벤치가 흔들림(벽에 붙이기)","맨몸, 손으로 철봉 기둥 잡기","3초 하강, 1.5회 반복, 덤벨 2개","1~4단계"],["덤벨 리버스 런지","덤벨","둔근, 대퇴사두, 균형","① 양손에 덤벨을 들고 선다. ② 한 발을 크게 뒤로 빼며 양 무릎이 90도가 되게 내려간다. ③ 앞발로 밀어 제자리로 돌아온다.","내려갈 때 들이쉬기.","보폭이 너무 짧음 / 앞무릎이 안쪽으로 모임","맨몸","덤벨 무겁게, 뒤로 간 뒤 2초 정지","1~4단계"],["싱글 카프레이즈","덤벨","종아리","① 스텝밀 계단 끝(또는 계단)에 한 발 앞꿈치만 올리고 손으로 기둥을 잡는다. ② 반대 손에 덤벨. ③ 뒤꿈치를 최대한 내려 1초 정지 후 최대한 올린다.","올릴 때 내쉬기.","반동으로 튕기기 / 범위가 짧음","양발","맨 위 2초 정지","1~4단계"],["덤벨 루마니안 데드리프트","덤벨","햄스트링, 둔근, 척추기립근 (유연성에도 도움)","① 양손에 덤벨을 허벅지 앞에 들고 무릎을 살짝 굽힌다. ② 허리를 곧게 편 채 엉덩이를 뒤로 밀며 상체를 숙인다(무릎 각도는 거의 고정). ③ 허벅지 뒤가 충분히 당길 때까지 3초 동안 내린다. ④ 엉덩이를 앞으로 밀며 일어난다.","내려갈 때 들이쉬고 배에 힘, 일어날 때 내쉬기.","등이 둥글게 말림 / 스쿼트처럼 무릎을 많이 굽힘 / 덤벨이 몸에서 멀어짐","범위를 무릎 아래까지만","덤벨 2개 무겁게, 맨 아래 1초 정지","1~4단계"],["싱글레그 루마니안 데드리프트","덤벨","햄스트링, 둔근, 균형","① 한 발로 서서 반대 손에 덤벨을 든다. ② 들린 힘을 주고 골반을 앞으로 민다. ③ 30초 유지.","길게 호흡.","허리를 젖혀서 늘리는 척함","무릎 아래 쿠션","같은 쪽 팔을 머리 위로","전 단계"],["쿠션 위 앉아 전굴","유연성","햄스트링, 둔근 (앉아서 다리 펴기 목표)","① 접은 수건이나 쿠션 위에 앉아 다리를 앞으로 편다. ② 허리를 곧게 편 채 배꼽이 허벅지에 닿는다는 느낌으로 고관절에서 접는다. ③ 45초 유지.","내쉬며 조금씩 더 접기.","등을 둥글게 말아 손만 멀리 보내기","무릎 살짝 굽히기, 높은 쿠션","쿠션 없이","전 단계"]];
const CATS = ["맨몸","철봉","덤벨","코어"];
const CAT_VAR = {"맨몸":"--c-body","철봉":"--c-bar","덤벨":"--c-db","코어":"--c-core","유연성":"--c-flex"};
const PLAN_LABEL = {"회복일":"회복일","유산소":"천국의 계단 유산소","휴식":"휴식 · 주간 리뷰"};
const HABITS = [["protein","단백질 125g+"],["water","물 2L+"],["kcal","칼로리 조절"],["isp","아침 ISP"],["creatine","크레아틴 3~5g"],["wpi","저녁 WPI"]];
const FLEX = [["f1","밴드 햄스트링"],["f2","능동 다리 올리기"],["f3","고관절 스트레칭"],["f4","쿠션 전굴"]];
const TRAIN_IDX = [0,1,3,4,5];
const MEAS_WEEKS = [0,4,8,12];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const DOW = ["일","월","화","수","목","금","토"];
const slug = s => s.replace(/\s*\(.*?\)\s*/g,"").replace(/[^0-9A-Za-z\uAC00-\uD7A3]+/g,"_");
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;

/* ---------- state ---------- */
const S = { settings:{start:PLAN.start}, days:{}, meas:{}, tab:"today", date:null, persisted:null };
function startDate(){ return S.settings.start || PLAN.start; }
function info(date){
  const idx = diffDays(startDate(), date);
  const inRange = idx >= 0 && idx < 84;
  const di = ((idx % 7) + 7) % 7;
  const wk = Math.floor(idx/7)+1;
  const plan = PLAN.dayPlan[di];
  return { idx, inRange, wk, di, plan, deload: PLAN.deload.includes(wk), train: TRAIN_IDX.includes(di) };
}
function setsFor(n, wk){ return PLAN.deload.includes(wk) ? Math.max(1, Math.ceil(n/2)) : n; }
function restFor(name, cat){
  if (/풀업|친업/.test(name) && !/밴드/.test(name)) return 120;
  if (cat === "코어") return 45;
  if (/스쿼트|데드리프트|프레스|로우|힙쓰러스트|푸시업|런지/.test(name)) return 90;
  return 60;
}
function latestMeas(date){
  let best = null;
  for (const w of MEAS_WEEKS){
    const m = S.meas["m"+w]; if (!m) continue;
    const mdate = w===0 ? addDays(startDate(), -1) : addDays(startDate(), w*7-1);
    if (mdate <= date) best = {w, ...m};
  }
  return best;
}
function lastWith(key){ // latest measurement value of a field (any date)
  for (const w of [...MEAS_WEEKS].reverse()){ const v = num(S.meas["m"+w]?.[key]); if (v != null) return {w, v}; }
  return null;
}
function targetText(name, tgt, wk, date){
  if (name === "AB 롤아웃") tgt += " · " + (wk<=3 ? "무릎·벽 앞" : wk<=7 ? "무릎·끝까지" : "무릎·3초 펴기");
  const m = latestMeas(date);
  if (name === "정자세 풀업"){
    const mx = num(m?.pull);
    if (mx != null){ const block = Math.max(0, (wk-1) - (m.w===0?0:m.w)); return `5 × ${Math.max(1, Math.round(mx*0.6) + block)}회 (최대 ${mx}개 기준, 매주 +1)`; }
    return tgt + " · 측정 탭에 최대 입력";
  }
  if (name === "정자세 친업"){
    const mx = num(m?.chin);
    if (mx != null) return `3 × ${Math.max(1, mx-2)}회 (최대 ${mx}개 − 2)`;
    return tgt + " · 측정 탭에 최대 입력";
  }
  return tgt;
}
function cardioTarget(i){
  if (PLAN.routines[i.plan]) return "15분";
  if (i.plan === "회복일") return "20~30분 (선택)";
  if (i.plan === "유산소") return i.wk<=4 ? "35분" : i.wk===5 ? "40분" : "45분";
  return "-";
}
function day(date){ return S.days[date] || (S.days[date] = {}); }
function score(d, i){ if (!i.train) return 0; return d?.status==="O" ? 1 : d?.status==="△" ? .5 : 0; }

/* ---------- storage (이 기기 안에 저장) ---------- */
const LS_KEY = "homet-v1";
let saveT = null;
function setSave(kind, text){ const el = $("#save"); el.innerHTML = `<span class="dot ${kind}"></span><span>${esc(text)}</span>`; }
function persistNow(){
  try{
    S.settings.savedAt = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify({v:1, settings:S.settings, days:S.days, meas:S.meas}));

function exportSetsCSV(){

  Object.keys(S.days).sort().forEach(dt => {
    const sets = S.days[dt].sets || {}, i = info(dt);
    Object.entries(sets).forEach(([k, ex]) => {
      const r = (ex.r||[]).map(v => v==null ? "" : v); while (r.length < 5) r.push("");
      const tot = r.map(num).filter(v=>v!=null).reduce((a,b)=>a+b,0);
      if (!tot && !ex.w) return;
      const w = num(ex.w);
      rows.push([dt, i.inRange ? i.wk : "", names[k]?.[0] || k, names[k]?.[1] || "", ex.w ?? "", ...r.slice(0,5), tot, w ? Math.round(w*tot) : ""]);

function fmtSigned(v){ return (v>0?"+":"") + (Math.round(v*10)/10).toFixed(1); }
function lineChart(pts, n, lo, hi){
  const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
  const vals = pts.map(p=>p[1]);
  let min = Math.min(...vals, lo) - .5, max = Math.max(...vals, hi) + .5;
  const x = k => L + (W-L-R) * k/(n-1), y = v => T + (H-T-B) * (1 - (v-min)/(max-min));
  let g = "";
  const step = (max-min) > 6 ? 2 : 1;
  for (let v = Math.ceil(min); v <= max; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  for (let w = 0; w <= 12; w += 4) g += `<text x="${x(Math.min(w*7,n-1))}" y="${H-6}" text-anchor="middle">${w}주</text>`;
  const band = `<rect x="${L}" width="${W-L-R}" y="${y(hi)}" height="${y(lo)-y(hi)}" fill="var(--good-soft)"/>`;
  const path = pts.map((p,k)=>`${k?"L":"M"}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(" ");
  const last = pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="아침 공복 체중 추이">${band}${g}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2" fill="var(--accent)"/>`).join("")}
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(x(last[0]), W-R-4)}" y="${y(last[1])-9}" text-anchor="end" style="fill:var(--ink);font-size:11px">${last[1]}kg</text></svg>
    <div class="legend"><span><span style="display:inline-block;width:10px;height:10px;background:var(--good-soft);vertical-align:middle"></span> 목표 범위 68~70kg</span><span>크레아틴 초기 +1~2kg은 수분</span></div>`;
}

function findGuide(name){

  return EX.find(e => e[0] === name) || EX.find(e => e[0].replace(/\s*\(.*?\)\s*/g,"") === base) || EX.find(e => e[0].includes(base) || base.includes(e[0].replace(/\s*\(.*?\)\s*/g,"")))
    || EX.find(e => base.split(" ").filter(Boolean).every(w => e[0].includes(w)));
}

];

function timedSecs(tgt, wk){
  const m = tgt.match(/×\s*(\d+)\s*(?:~\s*(\d+))?\s*초/);
  if (!m) return null;
  return m[2] ? (wk <= 6 ? +m[1] : +m[2]) : +m[1];
}
function repGuess(text){ const m = text.match(/×\s*(\d+)/) || text.match(/(\d+)\s*회/); return m ? +m[1] : ""; }
function buildSession(date){
  const i = info(date), r = PLAN.routines[i.plan], steps = [];
  const P = (o) => steps.push(o);
  if (r){
    WARMUP(/상체/.test(i.plan)).forEach(([t, s, sec]) => P({kind:"warm", title:t, sub:s, secs:sec}));
    const all = {}; CATS.forEach(cat => r.cats[cat].forEach(([n, sets, tgt]) => all[n] = {n, sets, tgt, cat}));
    const order = (ORDER[i.plan] || Object.keys(all)).filter(n => all[n]);
    const done = new Set();
    order.forEach(n => {
      if (done.has(n)) return;
      const pair = SUPERSET.find(p => p.includes(n) && p.every(x => all[x]));
      const group = pair ? pair.map(x => all[x]) : [all[n]];
      group.forEach(g => done.add(g.n));
      const ns = Math.max(...group.map(g => setsFor(g.sets, i.wk)));
      for (let s = 0; s < ns; s++){
        group.forEach((g, gi) => {
          if (s >= setsFor(g.sets, i.wk)) return;
          const tgt = targetText(g.n, g.tgt, i.wk, date);
          const secs = timedSecs(g.tgt, i.wk);
          const sides = secs && /각 (방향|다리|쪽)/.test(g.tgt) ? 2 : 1;
          const base = {exName:g.n, key:slug(g.n), cat:g.cat, set:s, ns:setsFor(g.sets, i.wk), tgt, superset: !!pair};

  else if (act === "replace"){ applyImport("replace"); }
  else if (act === "cancelimp"){ importData = null; render(); }
  else if (act === "goto"){ S.date = v; S.tab = "today"; render(); window.scrollTo(0,0); }
});
$("#prev").onclick = () => { S.date = addDays(S.date,-1); render(); };
$("#next").onclick = () => { S.date = addDays(S.date, 1); render(); };
const openPick = () => { const p = $("#datePick"); try { p.showPicker(); } catch(_) { p.style.pointerEvents="auto"; p.focus(); p.click(); } };
$("#when").onclick = openPick;
$("#when").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPick(); } };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#sheetRoot").innerHTML = ""; });

/* ---------- rest timer ---------- */
let tEnd = 0, tTotal = 0, tInt = null, actx = null;
function startTimer(sec, label){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(_){}
  tTotal = sec; tEnd = Date.now() + sec*1000;
  $("#tL").textContent = `휴식 · ${label}`; $("#timer").hidden = false; $("#timer").classList.remove("ring");
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.ceil((tEnd - Date.now())/1000));
  $("#tT").textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  $("#tBar").style.width = (tTotal ? (1 - left/tTotal)*100 : 0) + "%";
  if (left === 0){ clearInterval(tInt); $("#timer").classList.add("ring"); $("#tL").textContent = "휴식 끝 · 다음 세트"; beep(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(_){} setTimeout(()=>{ if ($("#timer").classList.contains("ring")) $("#timer").hidden = true; }, 6000); }
}
function beep(){ try{ if (!actx) return; [0, .25].forEach(t0 => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001, actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.3, actx.currentTime+t0+.02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+t0+.2); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+.22); }); }catch(_){} }
$("#tPlus").onclick = () => { tEnd += 30000; tTotal += 30; $("#timer").classList.remove("ring"); clearInterval(tInt); tInt = setInterval(tick,250); };
$("#tMinus").onclick = () => { tEnd -= 15000; };
$("#tStop").onclick = () => { clearInterval(tInt); $("#timer").hidden = true; };

boot();
</script>
</body></html>
